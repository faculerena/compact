# compactf: build the release tarballs on all four targets, check each one against the
# stock release of the same version, and put them on a draft GitHub release.
#
# Runs on pushes to compactf-<version> branches and by hand. The release tag is
# fast-<version>: tags that start with "compact" would start compact-release.yml.
# The release stays a draft until someone publishes it.

name: compactf release

on:
  push:
    branches:
      - 'compactf-[0-9]*'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # the stock release this branch is built from
  COMPACTF_VERSION: '0.36.1'
  # compiler flags whose output is also compared with stock, one run per flag
  COMPACTF_EXTRA_COMPARE_FLAGS: ''

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-latest
            target: aarch64-darwin
          - runner: macos-15-intel
            target: x86_64-darwin
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Nix
        uses: ./.github/actions/setup-nix-cache
        with:
          skip_cache: 'true'

      - name: Record the release in the compiler version
        run: |
          EXPECTED="$(./scripts/stamp-compiler-version.sh \
            "$COMPACTF_VERSION" \
            "$(git rev-parse HEAD)" \
            "$(git show -s --format=%cs HEAD)")"
          echo "EXPECTED_COMPILER_VERSION=$EXPECTED" >> "$GITHUB_ENV"

      - name: Build
        run: nix build .#compactc-binary -L

      - name: Package
        run: |
          ASSET="compactf-$COMPACTF_VERSION-$TARGET.tar.gz"
          mkdir pkg
          cp -L result/bin/* result/lib/* pkg/
          chmod 755 pkg/*
          tar -czf "$ASSET" -C pkg .
          if command -v sha256sum > /dev/null; then sum=sha256sum; else sum="shasum -a 256"; fi
          $sum "$ASSET" > "$ASSET.sha256"
          cat "$ASSET.sha256"
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"

      - name: Check the packaged compiler reports the stamped version
        run: |
          got="$(pkg/compactc --version)"
          if [ "$got" != "$EXPECTED_COMPILER_VERSION" ]; then
            echo "::error::built compiler reports '$got', expected '$EXPECTED_COMPILER_VERSION'"
            exit 1
          fi
          echo "compactc --version -> $got"

      - name: Download stock compactc ${{ env.COMPACTF_VERSION }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "compactc-v$COMPACTF_VERSION" -R LFDT-Minokawa/compact \
            -p "compactc_v${COMPACTF_VERSION}_${TARGET}.zip" -D stock-zip
          mkdir stock
          unzip -q stock-zip/*.zip -d stock
          chmod +x stock/* || true
          stock/compactc --version

      - name: Compile examples with keys; compare with stock
        run: |
          set -o pipefail
          for c in counter election; do
            for flag in "" $COMPACTF_EXTRA_COMPARE_FLAGS; do
              n="$c${flag:+-${flag#--}}"
              echo "::group::$n"
              time pkg/compactc ${flag:+"$flag"} "examples/$c.compact" "out-fast/$n"
              time stock/compactc ${flag:+"$flag"} "examples/$c.compact" "out-stock/$n"
              ls "out-fast/$n/keys"
              echo "::endgroup::"
            done
          done
          if command -v sha256sum > /dev/null; then sum=sha256sum; else sum="shasum -a 256"; fi
          # the only expected differences: the compiler-commit recorded in compiler/*.json,
          # and so the manifest's hash of compiler/contract-info.json.  Check that hash
          # against the file, then mask both.
          for d in out-fast out-stock; do
            for m in "$d"/*/compiler/contract-manifest.json; do
              want="$($sum "$(dirname "$m")/contract-info.json" | awk '{ print $1 }')"
              perl -0ne 'print "$1\n" if /"contract-info\.json":\s*\{[^}]*"hash":\s*"([0-9a-f]+)"/' "$m" | grep -qx "$want" \
                || { echo "::error::$m: wrong hash for contract-info.json"; exit 1; }
              perl -0pi -e 's/("contract-info\.json":\s*\{[^}]*"hash":\s*")[0-9a-f]+/${1}-/' "$m"
            done
            find "$d" -path '*/compiler/*.json' -exec \
              perl -0pi -e 's/"compiler-commit"\s*:\s*"[^"]*"/"compiler-commit":"-"/g' {} +
          done
          if ! diff -r out-stock out-fast; then
            echo "::error::compactf output differs from stock $COMPACTF_VERSION"
            exit 1
          fi
          n="$(find out-fast -name '*.prover' | wc -l)"
          [ "$n" -gt 0 ] || { echo "::error::no keys were generated"; exit 1; }
          echo "compactf output matches stock ($n proving keys)"

      - name: Install from the tarball with install.sh and compile
        run: |
          # serve the tarball from a file:// stand-in for the release URL
          mkdir -p fakerel
          cp "$ASSET" "$ASSET.sha256" fakerel/
          sed -e "s|https://github.com/\$REPO/releases/download/fast-\$VERSION/|file://$PWD/fakerel/|" \
              -e "s|--proto '=https' ||" compactf/install.sh > install-test.sh
          export HOME="$PWD/home"
          mkdir -p "$HOME"
          bash install-test.sh --version "$COMPACTF_VERSION"
          "$HOME/.local/bin/compactf" --version
          "$HOME/.local/bin/compactf" list
          "$HOME/.local/bin/compactf" compile "+$COMPACTF_VERSION" examples/counter.compact out-installed
          ls out-installed/keys/increment.prover
          "$HOME/.local/bin/compactf" format --help > /dev/null 2>&1 || "$HOME/.local/bin/compactf" format --version

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          if-no-files-found: error

  release:
    name: Draft release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="fast-$COMPACTF_VERSION"
          cp compactf/install.sh dist/install.sh
          (cd dist && sha256sum compactf-*.tar.gz > SHA256SUMS)
          ls -la dist
          if gh release view "$TAG" > /dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft -q .isDraft)" != "true" ]; then
              echo "::error::release $TAG is already published; delete it or bump the version to replace its files"
              exit 1
            fi
            gh release edit "$TAG" --target "$GITHUB_SHA"
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --draft --target "$GITHUB_SHA" \
              --title "compactf $COMPACTF_VERSION" \
              --notes "$(sed "s/@VERSION@/$COMPACTF_VERSION/g; s/@COMMIT@/$GITHUB_SHA/g" compactf/RELEASE_NOTES.md)"
          fi
